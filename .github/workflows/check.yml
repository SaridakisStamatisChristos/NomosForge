name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: bash scripts/reproduce.sh
      # Verify a clean local cargo install and the documented end-user CLI journey.
      - run: bash scripts/smoke_install.sh
      - run: python3 scripts/manifest.py > /tmp/nomos-manifest.json
      - run: python3 -c "import json; d=json.load(open('/tmp/nomos-manifest.json'));assert d['files'] and len(d['commit'])==40"
      - run: cargo run --locked --quiet -p nomos-cli -- corpus > /tmp/nomos-corpus.jsonl
      - run: cargo run --locked --quiet -p nomos-cli -- synth examples/water-allocation/world.nomos.yaml --json /tmp/nomos-synth.json
      - run: python3 reference/compare_rust.py /tmp/nomos-corpus.jsonl /tmp/nomos-synth.json
      - run: python3 reference/nomosforge_reference.py --output /tmp/nomos-reference.json
      - run: python3 -c "import json;assert json.load(open('/tmp/nomos-reference.json'))==json.load(open('reference/nomosforge_experiment_results.json'))"
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup toolchain install 1.82.0 --profile minimal
      - run: cargo +1.82.0 test --workspace --all-targets --locked
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q reference/test_nomosforge_reference.py
