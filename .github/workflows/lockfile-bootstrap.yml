name: Temporary Cargo.lock bootstrap
on:
  push:
    branches:
      - chore/cargo-lockfile-20261019
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install declared minimum Rust toolchain
        run: rustup toolchain install 1.82.0 --profile minimal
      - name: Resolve and test dependencies with Rust 1.82
        run: |
          # Modern Cargo can resolve to this workspace's declared 1.82 MSRV.
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback cargo +stable generate-lockfile
          # Convert the generated lock syntax to Cargo 1.82's supported v3 format.
          # The following locked test/build verify both format and dependency selection.
          python3 -c 'from pathlib import Path; p=Path("Cargo.lock"); s=p.read_text(); assert "\nversion = 4\n" in s; p.write_text(s.replace("\nversion = 4\n", "\nversion = 3\n", 1))'
          cargo +1.82.0 test --workspace --all-targets --locked
          cargo +1.82.0 build --workspace --locked
      - name: Commit verified Cargo.lock to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git diff --cached --exit-code && { echo "ERROR: missing generated lockfile"; exit 1; } || true
          git commit -m "build: add validated Rust workspace lockfile"
          git push origin HEAD:chore/cargo-lockfile-20261019
