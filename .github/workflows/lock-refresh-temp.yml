name: TEMP resolve sha2 Cargo.lock
on: push
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.82.0 --profile minimal
      - name: Resolve workspace lock on MSRV
        run: cargo +1.82.0 check -p nomos-cli
      - name: Print lock for audited commit update
        run: |
          echo NOMOS_LOCK_BEGIN
          base64 -w0 Cargo.lock
          echo
          echo NOMOS_LOCK_END
